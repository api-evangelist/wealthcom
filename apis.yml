aid: wealthcom
name: Wealth.com
description: 'Wealth.com is the industry-leading estate and tax planning platform for financial
  advisors, unifying estate document creation, tax intelligence, and its proprietary Ester AI
  assistant to help advisors deliver sophisticated planning at scale. For developers, Wealth.com
  publishes an Advisor API (OAuth2, JSON over HTTPS) that connects advisor applications to the
  platform for managing clients, assets, documents, contacts, quizzes, and AI notes, plus a
  webhook surface for real-time events and an Onboarding API for partner-referred client
  onboarding. A separate SFTP interface supports bulk data exchange. The company is backed by
  GV (Google Ventures) and integrates with Salesforce, Orion, Redtail, Wealthbox, Addepar,
  eMoney, and other advisor tools.'
